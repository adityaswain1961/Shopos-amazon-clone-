name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/shopos

defaults:
  run:
    working-directory: shopos

jobs:
  # ─── Compile + test every language ─────────────────────────────────
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shopos/package-lock.json
      - run: npm ci
      - name: Build shared packages
        run: |
          for p in shared-types observability kafka-client jwt-verifier; do
            npm run build --workspace=packages/$p
          done
      - name: Type-check / build all Node services
        run: |
          for s in auth-service user-service product-service review-service coupon-service notification-service; do
            echo "::group::$s"; npm run build --workspace=services/$s; echo "::endgroup::"
          done
      - name: Unit tests
        run: |
          npm test --workspace=services/auth-service
          npm test --workspace=services/user-service
          npm test --workspace=services/product-service

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shopos/package-lock.json
      - run: npm ci
      - run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopos/services/inventory-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go mod verify
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopos/services/cart-service
    steps:
      - uses: actions/checkout@v4
      # same compiler as the Docker builder image (Cargo.toml rust-version)
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: shopos/services/cart-service
      - run: cargo build --locked
      - run: rustup component add clippy && cargo clippy --locked -- -D warnings

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopos/services/order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q verify

  dotnet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shopos/services/payment-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet build -c Release -warnaserror:false

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [discovery-service, analytics-service]
    defaults:
      run:
        working-directory: shopos/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: shopos/services/${{ matrix.service }}/requirements.txt
      - run: pip install -r requirements.txt
      - name: Byte-compile and import the app
        run: |
          python -m compileall -q src
          cd src && DISABLE_INDEXER=true python -c "import main; print('import ok')"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint infrastructure/helm/shopos -f infrastructure/helm/shopos/values.yaml -f infrastructure/helm/shopos/values-production.yaml
      - run: helm template shopos infrastructure/helm/shopos -f infrastructure/helm/shopos/values-production.yaml --set global.imageTag=ci > /dev/null

  # ─── Images ────────────────────────────────────────────────────────
  build-images:
    runs-on: ubuntu-latest
    needs: [node, web, go, rust, java, dotnet, python, helm]
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node services share one Dockerfile and build from the monorepo root
          - { service: auth-service,         context: shopos, dockerfile: shopos/docker/node-service.Dockerfile, args: "SERVICE=auth-service\nPORT=3001" }
          - { service: user-service,         context: shopos, dockerfile: shopos/docker/node-service.Dockerfile, args: "SERVICE=user-service\nPORT=3002" }
          - { service: product-service,      context: shopos, dockerfile: shopos/docker/node-service.Dockerfile, args: "SERVICE=product-service\nPORT=3003" }
          - { service: review-service,       context: shopos, dockerfile: shopos/docker/node-service.Dockerfile, args: "SERVICE=review-service\nPORT=3005" }
          - { service: coupon-service,       context: shopos, dockerfile: shopos/docker/node-service.Dockerfile, args: "SERVICE=coupon-service\nPORT=3009" }
          - { service: notification-service, context: shopos, dockerfile: shopos/docker/node-service.Dockerfile, args: "SERVICE=notification-service\nPORT=3013" }
          - { service: inventory-service, context: shopos/services/inventory-service, dockerfile: shopos/services/inventory-service/Dockerfile, args: "" }
          - { service: order-service,     context: shopos/services/order-service,     dockerfile: shopos/services/order-service/Dockerfile,     args: "" }
          - { service: payment-service,   context: shopos/services/payment-service,   dockerfile: shopos/services/payment-service/Dockerfile,   args: "" }
          - { service: cart-service,      context: shopos/services/cart-service,      dockerfile: shopos/services/cart-service/Dockerfile,      args: "" }
          - { service: discovery-service, context: shopos/services/discovery-service, dockerfile: shopos/services/discovery-service/Dockerfile, args: "" }
          - { service: analytics-service, context: shopos/services/analytics-service, dockerfile: shopos/services/analytics-service/Dockerfile, args: "" }
          - { service: web,               context: shopos,                            dockerfile: shopos/apps/web/Dockerfile,                   args: "" }
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-args: ${{ matrix.args }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  security-scan:
    runs-on: ubuntu-latest
    needs: [node]
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: shopos
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
