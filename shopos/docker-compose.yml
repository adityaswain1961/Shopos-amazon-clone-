# ShopOS local stack.
#   docker compose up -d --build                     # everything (API on :8000)
#   docker compose --profile frontend up -d --build  # + Next.js on :3000
#
# Production overrides: docker-compose.prod.yml. Kubernetes: infrastructure/helm.

x-kafka-env: &kafka-env
  KAFKA_BROKERS: kafka:29092

x-common-env: &common-env
  AUTH_JWKS_URL: http://auth-service:3001/.well-known/jwks.json
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

x-node-build: &node-build
  context: .
  dockerfile: docker/node-service.Dockerfile

x-restart: &restart
  restart: unless-stopped

services:
  # ─── Data stores ──────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    <<: *restart
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: shopos_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopos_password}
      POSTGRES_DB: shopos_db
    command: >
      postgres -c max_connections=300 -c shared_buffers=256MB
               -c effective_cache_size=768MB -c work_mem=8MB
               -c log_min_duration_statement=500
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopos_admin -d shopos_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6
    <<: *restart
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin_password}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    <<: *restart
    ports: ["6379:6379"]
    # Carts live here, so never evict silently; caches use TTLs.
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka in KRaft mode: no ZooKeeper to run, patch or pay for.
  kafka:
    image: apache/kafka:3.7.1
    <<: *restart
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_RETENTION_HOURS: 72
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    # No volume: dev Kafka data is disposable (kafka-init recreates topics).
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  # Creates every topic up-front with an explicit partition count
  # (partitions = max useful consumer parallelism). See infrastructure/kafka/topics.yaml.
  kafka-init:
    image: apache/kafka:3.7.1
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/bash", "/topics/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
      PARTITIONS: "6"
      REPLICATION: "1"
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/topics/create-topics.sh:ro
    restart: "no"

  elasticsearch:
    image: elasticsearch:8.13.0
    <<: *restart
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ─── Gateway ──────────────────────────────────────────────────────
  kong:
    image: kong:3.4.0-ubuntu
    <<: *restart
    depends_on:
      - auth-service
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: "off"
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PLUGINS: bundled
      KONG_NGINX_WORKER_PROCESSES: auto
      # shared memory used by the proxy-cache micro-cache
      KONG_MEM_CACHE_SIZE: 256m
    ports:
      - "8000:8000"
      - "8001:8001"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./kong/kong.yml:/kong/kong.yml:ro

  # ─── Node services (shared image recipe) ──────────────────────────
  auth-service:
    build: { <<: *node-build, args: { SERVICE: auth-service, PORT: "3001" } }
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD:-admin_password}@mongodb:27017/auth?authSource=admin
      REDIS_URL: redis://redis:6379
      PORT: 3001
      NODE_ENV: development
      # Dev auto-generates a signing key (single replica only). Set
      # JWT_PRIVATE_KEY before running more than one auth replica.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
    ports: ["3001:3001"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  user-service:
    build: { <<: *node-build, args: { SERVICE: user-service, PORT: "3002" } }
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      MONGO_URI: mongodb://admin:${MONGO_PASSWORD:-admin_password}@mongodb:27017/users?authSource=admin
      REDIS_URL: redis://redis:6379
      PORT: 3002
      NODE_ENV: development
    ports: ["3002:3002"]
    depends_on:
      mongodb: { condition: service_healthy }
      redis: { condition: service_healthy }
      auth-service: { condition: service_started }

  # One-shot schema migration. Runs once per deploy instead of every replica
  # racing `prisma db push` at boot.
  product-migrate:
    build: { <<: *node-build, target: build, args: { SERVICE: product-service } }
    working_dir: /app/services/product-service
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://shopos_admin:${POSTGRES_PASSWORD:-shopos_password}@postgres:5432/shopos_db?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  product-service:
    build: { <<: *node-build, args: { SERVICE: product-service, PORT: "3003" } }
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      DATABASE_URL: postgresql://shopos_admin:${POSTGRES_PASSWORD:-shopos_password}@postgres:5432/shopos_db?schema=public&connection_limit=10
      REDIS_URL: redis://redis:6379
      PORT: 3003
      NODE_ENV: development
    ports: ["3003:3003"]
    depends_on:
      product-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  review-service:
    build: { <<: *node-build, args: { SERVICE: review-service, PORT: "3005" } }
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      DATABASE_URL: postgresql://shopos_admin:${POSTGRES_PASSWORD:-shopos_password}@postgres:5432/shopos_db
      PG_POOL_MAX: 10
      PORT: 3005
      NODE_ENV: development
    ports: ["3005:3005"]
    depends_on:
      product-migrate: { condition: service_completed_successfully }

  coupon-service:
    build: { <<: *node-build, args: { SERVICE: coupon-service, PORT: "3009" } }
    <<: *restart
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://shopos_admin:${POSTGRES_PASSWORD:-shopos_password}@postgres:5432/shopos_db
      REDIS_URL: redis://redis:6379
      PORT: 3009
      NODE_ENV: development
    ports: ["3009:3009"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  notification-service:
    build: { <<: *node-build, args: { SERVICE: notification-service, PORT: "3013" } }
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      REDIS_URL: redis://redis:6379
      PORT: 3013
      NODE_ENV: development
      # set SMTP_HOST (e.g. Amazon SES SMTP) or RESEND_API_KEY to send real email
      SMTP_HOST: ${SMTP_HOST:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports: ["3013:3013"]
    depends_on:
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # ─── Polyglot services ────────────────────────────────────────────
  inventory-service:
    build: ./services/inventory-service
    <<: *restart
    environment:
      <<: *kafka-env
      DATABASE_URL: postgres://shopos_admin:${POSTGRES_PASSWORD:-shopos_password}@postgres:5432/shopos_db
      DB_POOL_MAX: 20
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      PORT: 3004
    ports: ["3004:3004"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  cart-service:
    build: ./services/cart-service
    <<: *restart
    environment:
      REDIS_URL: redis://redis:6379/1
      PORT: 3006
    ports: ["3006:3006"]
    depends_on:
      redis: { condition: service_healthy }

  order-service:
    build: ./services/order-service
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopos_db
      SPRING_DATASOURCE_USERNAME: shopos_admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-shopos_password}
      DB_POOL_MAX: 20
      SERVER_PORT: 3007
    ports: ["3007:3007"]
    depends_on:
      product-migrate: { condition: service_completed_successfully }
      kafka-init: { condition: service_completed_successfully }

  payment-service:
    build: ./services/payment-service
    <<: *restart
    environment:
      <<: [*kafka-env, *common-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=shopos_db;Username=shopos_admin;Password=${POSTGRES_PASSWORD:-shopos_password};Maximum Pool Size=30
      ASPNETCORE_URLS: http://+:3008
      ASPNETCORE_ENVIRONMENT: Development
      # mock = every payment succeeds instantly. Use stripe + keys for real payments.
      PAYMENT_MODE: ${PAYMENT_MODE:-mock}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports: ["3008:3008"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  discovery-service:
    build: ./services/discovery-service
    <<: *restart
    environment:
      <<: *kafka-env
      ELASTICSEARCH_URL: http://elasticsearch:9200
      PORT: 3010
      WEB_CONCURRENCY: 2
    ports: ["3010:3010"]
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  analytics-service:
    build: ./services/analytics-service
    <<: *restart
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://shopos_admin:${POSTGRES_PASSWORD:-shopos_password}@postgres:5432/shopos_db
      PORT: 3014
      WEB_CONCURRENCY: 1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
    ports: ["3014:3014"]
    depends_on:
      postgres: { condition: service_healthy }

  # ─── Frontend ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        API_INTERNAL_URL: http://product-service:3003
    profiles: ["frontend"]
    <<: *restart
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      API_INTERNAL_URL: http://product-service:3003

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  es_data:
