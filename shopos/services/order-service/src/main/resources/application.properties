spring.application.name=order-service
server.port=${SERVER_PORT:${PORT:3007}}

# Finish in-flight requests on SIGTERM (Kubernetes rolling deploys)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s

# Java 21 virtual threads for Tomcat + @Async/@Scheduled + Kafka listeners
spring.threads.virtual.enabled=true

# ─── Database ────────────────────────────────────────────────────────
# Schema is owned by infrastructure/db (init.sql + migrations), never by Hibernate.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shopos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:shopos_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:shopos_password}
# Per-pod pool; total = replicas x pool. Go through PgBouncer in production.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:4}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1800000
# Set PG_PREPARE_THRESHOLD=0 if you run a PgBouncer older than 1.21 in transaction mode.
spring.datasource.hikari.data-source-properties.prepareThreshold=${PG_PREPARE_THRESHOLD:5}
spring.datasource.hikari.data-source-properties.ApplicationName=order-service

# ─── Kafka ───────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=order-saga-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=200
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
spring.kafka.listener.ack-mode=record
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
# gzip: the only codec every client here supports natively (kafkajs has no LZ4/Snappy/ZSTD)
spring.kafka.producer.compression-type=gzip
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.delivery.timeout.ms=30000

# ─── Auth (JWT verified locally against cached JWKS) ─────────────────
shopos.jwks-url=${AUTH_JWKS_URL:http://localhost:3001/.well-known/jwks.json}
shopos.jwt-issuer=shopos-auth-service

# ─── Saga / outbox ───────────────────────────────────────────────────
shopos.outbox.poll-ms=${OUTBOX_POLL_MS:200}
shopos.outbox.batch-size=${OUTBOX_BATCH_SIZE:500}
# Must be shorter than inventory's reservation expiry (30 min)
shopos.saga.payment-timeout-minutes=${PAYMENT_TIMEOUT_MINUTES:20}
shopos.orders.max-items=50

# ─── Observability ───────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.metrics.tags.application=order-service
management.metrics.distribution.percentiles-histogram.http.server.requests=true

logging.level.org.apache.kafka=WARN
