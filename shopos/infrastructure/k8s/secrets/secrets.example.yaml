# DO NOT commit real secrets. Copy to secrets.yaml (git-ignored) and seal it
# with Sealed Secrets / SOPS, or source these from Vault / your cloud's secret store.
#
# Generate the auth signing key once and share it with every auth replica:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out jwt.pem
#   (paste the PEM below, newlines escaped as \n)
apiVersion: v1
kind: Secret
metadata:
  name: shopos-secrets
  namespace: shopos
type: Opaque
stringData:
  # ─── Postgres ───────────────────────────────────────────────
  # App traffic goes through PgBouncer (transaction pooling).
  # Plain URL — used by inventory (pgx), analytics (libpq), review/coupon (node-pg).
  # Do NOT add query options here: pgx/libpq reject Prisma-style parameters.
  DATABASE_URL: "postgresql://shopos:REPLACE_ME@pgbouncer:5432/shopos_db"
  # Prisma (product-service) gets its own URL with Prisma-only options.
  PRISMA_DATABASE_URL: "postgresql://shopos:REPLACE_ME@pgbouncer:5432/shopos_db?schema=public&pgbouncer=true&connection_limit=10"
  # Migrations connect directly (session features PgBouncer doesn't offer).
  DATABASE_URL_DIRECT: "postgresql://shopos:REPLACE_ME@postgres-primary:5432/shopos_db?schema=public"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pgbouncer:5432/shopos_db"
  SPRING_DATASOURCE_USERNAME: "shopos"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_ME"
  ConnectionStrings__DefaultConnection: "Host=pgbouncer;Port=5432;Database=shopos_db;Username=shopos;Password=REPLACE_ME;Maximum Pool Size=30;No Reset On Close=true"

  # ─── MongoDB / Redis ────────────────────────────────────────
  MONGO_URI: "mongodb://shopos:REPLACE_ME@mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/auth?replicaSet=rs0&authSource=admin"
  MONGO_USERS_URI: "mongodb://shopos:REPLACE_ME@mongodb-0.mongodb:27017,mongodb-1.mongodb:27017,mongodb-2.mongodb:27017/users?replicaSet=rs0&authSource=admin"
  # Cache Redis (maxmemory-policy allkeys-lru): product cache, rate limits, dedupe
  REDIS_URL: "redis://:REPLACE_ME@redis-cache:6379"
  # Durable Redis (noeviction + AOF): carts must never be evicted
  CART_REDIS_URL: "redis://:REPLACE_ME@redis-durable:6379"

  # ─── Auth ───────────────────────────────────────────────────
  JWT_PRIVATE_KEY: "REPLACE_ME"
  # During key rotation only: the previous public key (PEM)
  JWT_PREVIOUS_PUBLIC_KEY: ""

  # ─── Service-to-service ─────────────────────────────────────
  INTERNAL_API_TOKEN: "REPLACE_ME_LONG_RANDOM"

  # ─── Payments (Stripe) ──────────────────────────────────────
  STRIPE_SECRET_KEY: "REPLACE_ME"
  STRIPE_PUBLISHABLE_KEY: "REPLACE_ME"
  STRIPE_WEBHOOK_SECRET: "REPLACE_ME"

  # ─── Email (pick one) ───────────────────────────────────────
  SMTP_HOST: ""          # e.g. email-smtp.ap-south-1.amazonaws.com (Amazon SES)
  SMTP_USER: ""
  SMTP_PASS: ""
  RESEND_API_KEY: ""

  # ─── Optional AI (any OpenAI-compatible endpoint) ───────────
  OPENAI_API_KEY: ""
  OPENAI_BASE_URL: ""
