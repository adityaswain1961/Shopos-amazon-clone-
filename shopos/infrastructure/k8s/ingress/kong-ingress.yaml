apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopos-api
  namespace: shopos
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  tls:
    - hosts:
        - api.shopos.example.com
      secretName: shopos-api-tls
  rules:
    - host: api.shopos.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kong-proxy
                port:
                  number: 8000
