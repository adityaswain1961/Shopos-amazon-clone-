global:
  imageTag: ""  # set by CI/CD pipeline
  imagePullPolicy: Always

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilization: 65

services:
  auth-service:
    replicas: 3
  order-service:
    replicas: 3
  cart-service:
    replicas: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
