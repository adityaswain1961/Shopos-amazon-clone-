apiVersion: v1
kind: ConfigMap
metadata:
  name: shopos-common
  namespace: {{ .Values.global.namespace }}
data:
  KAFKA_BROKERS: {{ .Values.global.kafka.brokers | quote }}
  AUTH_JWKS_URL: {{ .Values.global.auth.jwksUrl | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.global.otel.endpoint | quote }}
  NODE_ENV: production
  LOG_LEVEL: info
