{{- $d := .Values.defaults }}
{{- range $name, $svc := .Values.services }}
{{- $port := $svc.port }}
{{- $resources := $svc.resources | default $d.resources }}
{{- $metricsOn := ne (toString $svc.metrics) "false" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
    shopos.io/tier: backend
    {{- include "shopos.labels" $ | nindent 4 }}
spec:
  {{- if not (dig "autoscaling" "enabled" $d.autoscaling.enabled $svc) }}
  replicas: {{ $svc.replicas | default 2 }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0        # never drop below current capacity during a deploy
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        shopos.io/tier: backend
      {{- if $metricsOn }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $port | quote }}
        prometheus.io/path: {{ $svc.metricsPath | default $d.metricsPath | quote }}
      {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ $d.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- if $.Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $name }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: {{ $name }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}/{{ $.Values.global.imagePrefix }}{{ $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ $port }}
          envFrom:
            - configMapRef:
                name: shopos-common
            - secretRef:
                name: shopos-secrets
          env:
            - name: PORT
              value: {{ $port | quote }}
            - name: SERVER_PORT
              value: {{ $port | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- /* env var name → key in shopos-secrets; overrides envFrom for that name */}}
            {{- range $k, $v := $svc.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: shopos-secrets
                  key: {{ $v }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if $svc.startupProbe }}
          startupProbe:
            httpGet:
              path: {{ $svc.livenessPath | default $d.livenessPath }}
              port: http
            periodSeconds: 5
            failureThreshold: 30     # up to 150s to boot (JVM)
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessPath | default $d.livenessPath }}
              port: http
            initialDelaySeconds: {{ if $svc.startupProbe }}0{{ else }}15{{ end }}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessPath | default $d.readinessPath }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep {{ $d.preStopSleepSeconds }}"]
          resources:
            {{- toYaml $resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
{{- end }}
