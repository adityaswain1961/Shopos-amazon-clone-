{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopos-api
  namespace: {{ .Values.global.namespace }}
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    {{- end }}
    # Body limit at the edge; rate limiting is done in Kong. (Upstream
    # keep-alive is an ingress-nginx ConfigMap setting, not an annotation.)
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.kongService }}
                port:
                  number: {{ .Values.ingress.kongPort }}
{{- end }}
