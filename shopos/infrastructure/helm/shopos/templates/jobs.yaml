{{- if .Values.jobs.productMigrations }}
---
# Runs `prisma migrate deploy` once per install/upgrade, before new pods roll out.
apiVersion: batch/v1
kind: Job
metadata:
  name: product-migrations
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: migrate
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imagePrefix }}product-service:{{ .Values.global.imageTag }}"
          workingDir: /app/services/product-service
          command: ["npx", "--no-install", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: shopos-secrets
                  # direct connection (not PgBouncer): migrations need session features
                  key: DATABASE_URL_DIRECT
{{- end }}
{{- if .Values.jobs.kafkaTopics }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  namespace: {{ .Values.global.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: topics
          image: {{ .Values.jobs.kafkaImage }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              KT=/opt/kafka/bin/kafka-topics.sh
              for t in user.registered user.profile_updated user.account_deleted \
                       product.created product.updated product.price_dropped product.categories \
                       order.created order.confirmed order.cancelled order.shipped \
                       inventory.confirmed inventory.failed inventory.release \
                       payment.initiate payment.completed payment.failed payment.refund_requested payment.refunded \
                       review.submitted; do
                $KT --bootstrap-server "{{ .Values.global.kafka.brokers }}" --create --if-not-exists \
                    --topic "$t" --partitions {{ .Values.global.kafka.partitions }} \
                    --replication-factor {{ .Values.global.kafka.replication }}
                $KT --bootstrap-server "{{ .Values.global.kafka.brokers }}" --create --if-not-exists \
                    --topic "$t.dlq" --partitions 1 --replication-factor {{ .Values.global.kafka.replication }}
              done
{{- end }}
