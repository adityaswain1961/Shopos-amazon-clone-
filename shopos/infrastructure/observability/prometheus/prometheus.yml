global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: shopos-local
    environment: development

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: kong
    static_configs:
      - targets: ['kong:8001']
    metrics_path: /metrics

  - job_name: shopos-node-services
    static_configs:
      - targets:
          - auth-service:3001
          - user-service:3002
          - product-service:3003
          - review-service:3005
          - coupon-service:3009
          - notification-service:3013
    metrics_path: /metrics

  - job_name: shopos-order-service
    static_configs:
      - targets: ['order-service:3007']
    metrics_path: /actuator/prometheus

  - job_name: shopos-inventory-service
    static_configs:
      - targets: ['inventory-service:3004']
    metrics_path: /metrics

  - job_name: shopos-payment-service
    static_configs:
      - targets: ['payment-service:3008']
    metrics_path: /metrics

  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
