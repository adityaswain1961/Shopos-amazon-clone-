name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/shopos

jobs:
  lint-and-test-node:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, user-service, product-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shopos/package-lock.json

      - name: Install dependencies
        working-directory: shopos
        run: npm ci

      - name: Build shared packages
        working-directory: shopos
        run: |
          npm run build --workspace=packages/shared-types
          npm run build --workspace=packages/kafka-client
          npm run build --workspace=packages/observability
          npm run build --workspace=packages/jwt-verifier

      - name: Build service
        working-directory: shopos
        run: npm run build --workspace=services/${{ matrix.service }}

      - name: Test service
        working-directory: shopos
        run: npm test --workspace=services/${{ matrix.service }} --if-present

  build-images:
    runs-on: ubuntu-latest
    needs: lint-and-test-node
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-service
            context: shopos
            dockerfile: shopos/services/auth-service/Dockerfile
          - service: user-service
            context: shopos
            dockerfile: shopos/services/user-service/Dockerfile
          - service: product-service
            context: shopos
            dockerfile: shopos/services/product-service/Dockerfile
          - service: coupon-service
            context: shopos/services/coupon-service
            dockerfile: Dockerfile
          - service: review-service
            context: shopos/services/review-service
            dockerfile: Dockerfile
          - service: notification-service
            context: shopos/services/notification-service
            dockerfile: Dockerfile
          - service: inventory-service
            context: shopos/services/inventory-service
            dockerfile: Dockerfile
          - service: order-service
            context: shopos/services/order-service
            dockerfile: Dockerfile
          - service: payment-service
            context: shopos/services/payment-service
            dockerfile: Dockerfile
          - service: cart-service
            context: shopos/services/cart-service
            dockerfile: Dockerfile
          - service: discovery-service
            context: shopos/services/discovery-service
            dockerfile: Dockerfile
          - service: analytics-service
            context: shopos/services/analytics-service
            dockerfile: Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test-node
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: shopos
          severity: CRITICAL,HIGH
          exit-code: "0"
