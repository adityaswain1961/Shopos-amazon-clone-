name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}

      - uses: azure/setup-helm@v4

      - name: Helm upgrade
        run: |
          export KUBECONFIG=$PWD/kubeconfig
          EXTRA_VALUES=""
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            EXTRA_VALUES="-f ./shopos/infrastructure/helm/shopos/values-production.yaml"
          fi
          helm upgrade --install shopos ./shopos/infrastructure/helm/shopos \
            --namespace shopos --create-namespace \
            -f ./shopos/infrastructure/helm/shopos/values.yaml \
            $EXTRA_VALUES \
            --set global.imageTag=${{ github.event.workflow_run.head_sha || github.sha }}

      # ArgoCD GitOps alternative (uncomment when ArgoCD is configured):
      # - name: Sync ArgoCD application
      #   run: |
      #     argocd app sync shopos --grpc-web
