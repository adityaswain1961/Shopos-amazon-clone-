_format_version: "3.0"

# ShopOS API gateway (Kong OSS, DB-less).
#
# Edge responsibilities, applied once here instead of in every service:
#   - CORS (browser → api on another origin)
#   - correlation id for tracing a request across services
#   - coarse per-IP rate limiting (fine-grained per-user limits live in services)
#   - micro-caching of public catalog reads (proxy-cache), honouring the
#     services' Cache-Control headers, so hot products/searches are served
#     from gateway memory instead of hitting the services
#
# Production: set your real storefront origin(s) in the cors plugin below.

plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

  - name: cors
    config:
      origins:
        - http://localhost:3000
      methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
      headers: [Accept, Authorization, Content-Type, X-Correlation-Id, Idempotency-Key, X-Device-Fingerprint]
      exposed_headers: [X-Correlation-Id, X-RateLimit-Remaining-Minute, Retry-After]
      credentials: true
      max_age: 3600

  # Local (in-memory, per Kong node) counters: zero network cost per request.
  # Effective limit = limit × number of Kong nodes — size accordingly.
  # Kept generous because mobile carriers put many users behind one IP (CGNAT).
  - name: rate-limiting
    config:
      second: 30
      minute: 600
      policy: local
      limit_by: ip
      fault_tolerant: true
      hide_client_headers: false

  - name: request-size-limiting
    config:
      allowed_payload_size: 1
      size_unit: megabytes

  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

services:
  - name: auth-service
    url: http://auth-service:3001
    read_timeout: 15000
    routes:
      - name: auth-route
        paths: [/api/v1/auth]
        strip_path: false
      - name: jwks-route
        paths: [/.well-known]
        strip_path: false
    plugins:
      # brute-force protection on login/register/refresh
      - name: rate-limiting
        config:
          minute: 60
          policy: local
          limit_by: ip

  - name: user-service
    url: http://user-service:3002
    read_timeout: 15000
    routes:
      - name: user-route
        paths: [/api/v1/users]
        strip_path: false
    plugins:
      - name: request-size-limiting
        config:
          allowed_payload_size: 6   # avatar uploads (service enforces 5 MB)
          size_unit: megabytes

  - name: product-service
    url: http://product-service:3003
    read_timeout: 15000
    routes:
      - name: product-route
        paths: [/api/v1/products]
        strip_path: false
    plugins:
      # Micro-cache for public GETs (anchor reused below). With
      # cache_control=true Kong honours the upstream Cache-Control
      # (s-maxage / private / no-store), so personalised or draft
      # content is never cached.
      - &micro-cache
        name: proxy-cache
        config:
          strategy: memory
          cache_control: true
          cache_ttl: 30
          request_method: [GET, HEAD]
          response_code: [200, 404]
          content_type:
            - application/json
            - application/json; charset=utf-8

  - name: inventory-service
    url: http://inventory-service:3004
    read_timeout: 10000
    routes:
      # Read-only from the internet. Reserve/confirm/adjust are internal
      # (service-to-service) and also require X-Internal-Token.
      - name: inventory-route
        paths: [/api/v1/inventory]
        methods: [GET, HEAD, OPTIONS]
        strip_path: false
    plugins:
      - *micro-cache

  - name: review-service
    url: http://review-service:3005
    read_timeout: 15000
    routes:
      - name: review-route
        paths: [/api/v1/reviews]
        strip_path: false
    plugins:
      - *micro-cache

  - name: cart-service
    url: http://cart-service:3006
    read_timeout: 10000
    routes:
      - name: cart-route
        paths: [/api/v1/cart]
        strip_path: false

  - name: order-service
    url: http://order-service:3007
    read_timeout: 20000
    retries: 1
    routes:
      - name: order-route
        paths: [/api/v1/orders]
        strip_path: false

  - name: payment-service
    url: http://payment-service:3008
    read_timeout: 20000
    retries: 1
    routes:
      - name: payment-route
        paths: [/api/v1/payments]
        strip_path: false

  - name: coupon-service
    url: http://coupon-service:3009
    read_timeout: 10000
    routes:
      - name: coupon-route
        paths: [/api/v1/coupons]
        strip_path: false

  - name: search-service
    url: http://discovery-service:3010
    read_timeout: 10000
    routes:
      - name: search-route
        paths: [/api/v1/search]
        strip_path: false
    plugins:
      - *micro-cache

  - name: recommendation-service
    url: http://discovery-service:3010
    read_timeout: 10000
    routes:
      - name: recommendation-route
        paths: [/api/v1/recommendations]
        strip_path: false
    plugins:
      - *micro-cache

  - name: ai-help-service
    url: http://analytics-service:3014
    read_timeout: 30000
    routes:
      - name: ai-help-route
        paths: [/api/v1/ai-help]
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 20
          policy: local
          limit_by: ip

  - name: notification-service
    url: http://notification-service:3013
    routes:
      - name: notification-route
        paths: [/api/v1/notifications]
        strip_path: false

  - name: analytics-service
    url: http://analytics-service:3014
    routes:
      - name: analytics-route
        paths: [/api/v1/analytics]
        strip_path: false
