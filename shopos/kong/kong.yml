_format_version: "3.0"

# Global plugins: correlation ID, rate limiting, Prometheus metrics
plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-Id
      generator: uuid#counter
      echo_downstream: true

  - name: rate-limiting
    config:
      minute: 300
      hour: 5000
      policy: local
      fault_tolerant: true
      hide_client_headers: false

  - name: prometheus
    config:
      per_consumer: false
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
      upstream_health_metrics: true

services:
  - name: auth-service
    url: http://auth-service:3001
    routes:
      - name: auth-route
        paths:
          - /api/v1/auth
        strip_path: false
      - name: jwks-route
        paths:
          - /.well-known
        strip_path: false
    plugins:
      - name: rate-limiting
        config:
          minute: 60
          policy: local

  - name: user-service
    url: http://user-service:3002
    routes:
      - name: user-route
        paths:
          - /api/v1/users
        strip_path: false

  - name: product-service
